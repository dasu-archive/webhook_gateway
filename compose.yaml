# 게이트웨이 + 소비자 서비스 + MySQL 전체 스택. 저장소 루트에서 실행한다.
#
#   docker compose up -d --build      전체 기동
#   000_Infra/tools/e2e.sh            엔드포인트 등록 후 웹훅 한 건 흘려보기
#   docker compose down               정지 (데이터 유지)
#   docker compose down -v            정지 + 데이터 삭제

services:
  mysql:
    image: mysql:8.0
    container_name: wg-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --max_connections=300
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 볼륨이 비어 있을 때만 실행된다. 스키마를 다시 만들려면 down -v 로 볼륨을 지운다.
      - ./000_Infra/docker/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 20

  gateway:
    build: ./001_WebhookGateway
    container_name: wg-gateway
    environment:
      # 컨테이너 안에서 DB 는 localhost 가 아니라 서비스 이름으로 찾는다.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/webhook_gateway?serverTimezone=UTC&rewriteBatchedStatements=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      LOGGING_LEVEL_DEV_GATEWAY_WEBHOOK: INFO
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  service:
    build: ./002_WebhookService
    container_name: wg-service
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/webhook_service?serverTimezone=UTC&rewriteBatchedStatements=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      # 카오스 제어(/chaos/response-drop)를 켠다. 드롭률 기본값이 0 이라 켜 두기만 해서는 아무 일도 없다.
      WEBHOOK_CHAOS_ENABLED: "true"
    # 호스트에 포트를 열지 않는다. 소비자는 서명 검증이 없어 열어 두면 게이트웨이를 거치지 않은
    # 결제 경로가 생긴다. 게이트웨이는 같은 네트워크에서 service:8081 로 부른다.
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  # 지표 수집. UI: http://localhost:9091
  # 호스트 9090 은 게이트웨이 어드민 포트 분리(:9090) 몫으로 비워둔다.
  # gateway 에 depends_on 을 걸지 않는다 — 게이트웨이 없이도 뜨고 target 만 DOWN 으로 보인다.
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: wg-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./000_Infra/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  # 대시보드. UI: http://localhost:3000 (admin / admin)
  # 패널을 어드민 콘솔에 iframe 으로 embed 할 예정이라 embed 와 익명 조회를 켰다. 로컬 전용 설정이다.
  grafana:
    image: grafana/grafana:12.1.0
    container_name: wg-grafana
    environment:
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3000:3000"
    volumes:
      - ./000_Infra/docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mysql-data:
  prometheus-data:
  grafana-data:
